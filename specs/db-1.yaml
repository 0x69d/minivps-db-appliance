# mini-vps-platform 用 VM spec。
# `uv run mini-vps create specs/db-1.yaml` で作成する。
#
# base_image は build/build-golden-image.sh の出力ファイル名に置き換えること
# (ビルドのたびにファイル名の日付部分が変わるため)。
name: db-1
memory: 1024
vcpus: 2
base_image: minivps-db-golden-20260814.qcow2
disk: 10
hostname: db-1
networks:
  # 1件目 = 管理NIC。静的IPにする。
  # mini_vps/manager.py の _static_ipv4() は networks の先頭から走査して
  # 最初に見つかった静的NICのIPを `mini-vps status`/`get` に返す。管理NICを
  # 先頭かつ静的にすることで、複数の固定IPを持つこのVMでも
  # 「mini-vps status db-1」がSSH到達可能な管理IPを返す。
  - name: default
    address: 192.168.122.50/24
    gateway: 192.168.122.1   # このVM唯一のデフォルトルート
    # 全NICが静的だとnetplanがリゾルバを持たず、運用者がaptを叩けなくなる。
    nameservers:
      - 192.168.122.1
  # 2件目 = サービスNIC。seg2 に配置し、web-1(seg1)からは router-1 経由で
  # 192.168.202.50 に到達させる。
  - name: seg2
    address: 192.168.202.50/24
# web-1への戻り経路。接続は web-1 -> router-1 -> db-1 と届くが、この経路が無いと
# 応答がデフォルトルートへ非対称に流れて応答が返らない。
static_routes:
  - destination: 192.168.201.0/24
    via: 192.168.202.10   # router-1 の seg2 側IP
# filtersは未設定(デフォルトnull=libvirt側の追加inbound制限なし)。
# 受信保護はゴールデンイメージに焼き込んだゲスト内nftablesのinput chainが担う。
