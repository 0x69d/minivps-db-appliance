# minivps-db-appliance: MySQL接続元の許可リスト(運用者編集用)。
# /etc/nftables.conf の末尾でincludeされる。
#
# このファイルがトポロジ依存の唯一の箇所。web層とDB層をどのネットワークに置くかは
# 構成次第なので、既定値をそのまま使うのではなく自分の構成に合わせて書き換える。
#
# 記法: 各行は完全な `add rule inet filter input <マッチ条件...> accept` として書く。
# chain定義そのものは書かない。マッチはIPサブネット単位で書くこと。
#
# 編集後は必ずメインファイル経由でreloadすること。
# このファイル単体を `nft -f` すると `add rule` が無条件追記され、
# 再読込のたびにルールが重複する。flush rulesetから再構築される
# /etc/nftables.conf 経由でreloadすれば冪等。
#
#   sudo systemctl reload nftables
#
# 注意: /etc/mysql/mysql.conf.d/zz-minivps.cnf の bind-address は 0.0.0.0 のため、
# 到達制御はこのファイルが実質的に担っている。全行消すとDBに誰も到達できなくなり、
# 広く開けるとどこからでも繋がる。
#
# 送信元アドレスで判定できるのは、router-1がセグメント間転送でSNATしないため。
# ただしホスト側で net.bridge.bridge-nf-call-iptables が1だとlibvirtのmasqueradeが
# 効いて送信元が書き換わり、この許可に一致しなくなる。READMEの「送信元IPの保存」参照。

# 既定: web-1が所属するseg1からの3306のみ許可する。
# セグメントを分けない構成なら、ここをdefault(192.168.122.0/24)などに書き換える。
add rule inet filter input ip saddr 192.168.201.0/24 tcp dport 3306 accept
