#!/usr/sbin/nft -f
# minivps-db-appliance 既定ruleset。
#
# 方針: デフォルト拒否 + 許可リスト(minivps-dns-applianceと同型)。
# このVMはルーティングを行わないため、router版にあった forward chain の
# 許可リスト分離と sysctl の ip_forward 設定は同梱しない。

flush ruleset

table inet filter {
    # 管理アクセス許可元。specs/db-1.yamlのdefault NIC(192.168.122.0/24)からのみ。
    define MGMT_NET = 192.168.122.0/24

    # MySQL接続元。web-1が所属するseg1のみ。dns-applianceがRFC1918全域を許可して
    # いるのと違いセグメント1つに絞るのは、web層からしかDBに到達できないことが
    # この構成の要件そのものだから。
    # 送信元アドレスで判定できるのは、router-1がセグメント間転送でSNATしないため。
    define WEB_NET = 192.168.201.0/24

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # 診断用: pingを許可する。
        icmp type { echo-request, destination-unreachable, time-exceeded } accept

        # MySQLはweb層からのみ許可。
        # /etc/mysql/mysql.conf.d/99-minivps.cnf の bind-address は 0.0.0.0 のため、
        # 到達制御はこの1行が実質的に担っている。消すとどこからでも繋がる。
        ip saddr $WEB_NET tcp dport 3306 accept

        # SSH管理アクセスはdefaultセグメントからのみ許可。
        ip saddr $MGMT_NET tcp dport 22 accept
    }

    chain forward {
        # このVMは転送しない。設定ミスでip forwardingが有効になっても
        # 通過させないよう明示的に全拒否する。
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        # egressは制限しない。
        type filter hook output priority filter; policy accept;
    }
}
