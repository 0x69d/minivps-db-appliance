#!/usr/sbin/nft -f
# minivps-db-appliance 既定ruleset。
#
# 方針: デフォルト拒否 + 許可リスト(minivps-dns-applianceと同型)。
# このVMはルーティングを行わないため、router版にあった sysctl の ip_forward 設定は
# 同梱しない。ただしMySQL接続元の許可は構成によって変わるため、router版と同じく
# /etc/nftables.d/*.conf 側に分離する。

flush ruleset

table inet filter {
    # 管理アクセス許可元。specs/db-1.yamlのdefault NIC(192.168.122.0/24)からのみ。
    define MGMT_NET = 192.168.122.0/24

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # 診断用: pingを許可する。
        icmp type { echo-request, destination-unreachable, time-exceeded } accept

        # MySQLの許可はここには書かない。
        # /etc/nftables.d/*.conf (下記include) 側で
        # `add rule inet filter input ...` として追記する。

        # SSH管理アクセスはdefaultセグメントからのみ許可。
        ip saddr $MGMT_NET tcp dport 22 accept
    }

    chain forward {
        # このVMは転送しない。設定ミスでip forwardingが有効になっても
        # 通過させないよう明示的に全拒否する。
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        # egressは制限しない。
        type filter hook output priority filter; policy accept;
    }
}

# 運用者が編集するinput chainの許可リスト。
# 一致するファイルが無くてもエラーにならない。
include "/etc/nftables.d/*.conf"
